[package]
name = "oblivion-clipboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
wayland-client = "=0.31.14"
wayland-protocols = { version = "=0.32.12", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }

[profile.release]
strip = true
lto = true
