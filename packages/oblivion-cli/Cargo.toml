[package]
name = "oblivion-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[features]
windows-launcher = []

[[bin]]
name = "oblivion"
path = "src/main.rs"
required-features = ["windows-launcher"]

[dependencies]
getrandom = "0.2"
oblivion-wire = { path = "../oblivion-wire" }
oblivion-transfer = { path = "../oblivion-transfer" }
oblivion-share = { path = "../oblivion-share" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oblivion-transport = { path = "../oblivion-transport" }
vt100 = { version = "=0.18.1", default-features = false }
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
oblivion-native-windows = { path = "../oblivion-native-windows" }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Pipes", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
