[package]
name = "oblivion-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[features]
windows-launcher = []

[[bin]]
name = "oblivion"
path = "src/main.rs"
required-features = ["windows-launcher"]

[dependencies]
oblivion-wire = { path = "../oblivion-wire" }
oblivion-transfer = { path = "../oblivion-transfer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oblivion-transport = { path = "../oblivion-transport" }
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
getrandom = "0.2"
oblivion-native-windows = { path = "../oblivion-native-windows" }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes",
  "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading",
] }
