[package]
name = "oblivion-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[features]
lab-emulation = []

[dependencies]
base64 = "0.22"
oblivion-tor-state = { path = "../oblivion-tor-state" }
oblivion-transport = { path = "../oblivion-transport" }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = { version = "1.9.1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[bin]]
name = "oblivion-api"
path = "src/main.rs"

[[bin]]
name = "oblivion-gateway-control"
path = "src/control.rs"

[[bin]]
name = "oblivion-egress"
path = "src/egress_main.rs"

[[bin]]
name = "oblivion-tools"
path = "src/tools_main.rs"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
