[package]
name = "oblivion-transfer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "oblivion-copy"
path = "src/main.rs"

[[bin]]
name = "oblivion-copy-relay"
path = "src/relay-main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"

[profile.dev]
debug = 0
incremental = false
