# Session-local server and bounded RAM scrollback; no automatic capture files.
set-option -g default-shell /bin/bash
set-option -g default-command '/bin/bash --noprofile --norc'
set-option -g history-limit 2000
set-option -g mouse on
set-option -g set-clipboard off
set-option -g allow-passthrough off
set-option -g update-environment ''
set-option -g renumber-windows on
set-option -g status-style 'fg=#b6b6c4,bg=#19191f'
set-option -g status-left '#[fg=#d32f2f,bold] TERMINAL #[default]'
set-option -g status-left-length 12
set-option -g status-right 'Ctrl+b: c new | w windows | p processes | x close '
set-option -g status-right-length 52
set-option -g window-status-current-style 'fg=#f5f5f7,bg=#393943,bold'
set-option -g pane-border-style 'fg=#393943'
set-option -g pane-active-border-style 'fg=#d32f2f'
set-option -g allow-rename off
bind-key p new-window -n Processes '/usr/bin/top -u 1000'
