# Machine-level defaults are merged with the Safe's native user profiles.
[features]
# A private daemon pins a second copy of the Codex executable inside the Safe.
daemon_auto_start = false

[mcp_servers.oblivion]
command = "/usr/lib/oblivion/node/bin/node"
args = ["/usr/lib/oblivion/tools/server.mjs"]
enabled_tools = ["tor_rotate", "safe_status", "safe_create", "chat_create", "chat_status", "chat_cancel"]
startup_timeout_sec = 10
tool_timeout_sec = 170
