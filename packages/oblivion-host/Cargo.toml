[package]
name = "oblivion-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[features]
lab-emulation = []

[dependencies]
argon2 = { version = "=0.5.3", features = ["zeroize"] }
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
getrandom = "=0.2.17"
hkdf = "=0.12.4"
oblivion-cli = { path = "../oblivion-cli" }
oblivion-bundle = { path = "../oblivion-bundle" }
oblivion-wire = { path = "../oblivion-wire" }
oblivion-tor-state = { path = "../oblivion-tor-state" }
oblivion-transport = { path = "../oblivion-transport" }
oblivion-share = { path = "../oblivion-share" }
oblivion-transfer = { path = "../oblivion-transfer" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
vt100 = { version = "=0.18.1", default-features = false }
zeroize = { version = "1.9.1", features = ["serde"] }

[[bin]]
name = "oblivion"
path = "src/launcher.rs"

[[bin]]
name = "oblivion-storage"
path = "src/main.rs"

[[bin]]
name = "oblivion-control"
path = "src/client.rs"

[[bin]]
name = "oblivion-display"
path = "src/display_main.rs"
