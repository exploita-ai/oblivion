set default=0
set timeout=3
set menu_color_normal=light-red/black
set menu_color_highlight=white/red

menuentry 'Oblivion development - protected sessions' {
    # Physical UEFI can persist kernel crash logs outside all encrypted volumes.
    linux /live/vmlinuz boot=live live-media-offset=0 components nopersistence noeject nonetworking ip=off pstore.backend=none efi_pstore.pstore_disable=1 systemd.mask=systemd-pstore.service quiet loglevel=0 systemd.show_status=false systemd.getty_auto=no console=tty1
    initrd /live/initrd.img
}
