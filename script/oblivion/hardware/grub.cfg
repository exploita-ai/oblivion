set default=0
set timeout=3
set menu_color_normal=light-red/black
set menu_color_highlight=white/red

menuentry 'Oblivion HARDWARE TEST - Alt+F2 for Wi-Fi and Mac access' {
    # Disable firmware crash persistence before userspace, including diagnostics.
    linux /live/vmlinuz boot=live live-media-offset=0 components nopersistence noeject nonetworking ip=off ipv6.disable=1 pstore.backend=none efi_pstore.pstore_disable=1 systemd.mask=systemd-pstore.service quiet loglevel=0 systemd.show_status=false systemd.getty_auto=no console=tty1
    initrd /live/initrd.img
}
