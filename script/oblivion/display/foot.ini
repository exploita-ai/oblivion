[main]
term=foot
font=DejaVu Sans Mono:size=11
dpi-aware=no
pad=0x0
box-drawings-uses-font-glyphs=no
utmp-helper=none
selection-target=clipboard
workers=2

[colors]
background=101014
foreground=e4e4ec
selection-background=30303c
selection-foreground=ffffff

[scrollback]
lines=0

[security]
osc52=copy-enabled

[bell]
system=no
notify=no
visual=no

[desktop-notifications]
command=/usr/bin/true

[url]
launch=/usr/bin/true

[key-bindings]
spawn-terminal=none
clipboard-paste=Control+v Control+Shift+v
