name: Oblivion checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oblivion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-wire:
    name: Portable frontend, wire and Files (Windows; no VM backend)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/oblivion-wire
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust compiler
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Compile and exercise shared private wire bytes
        run: |
          cargo check --locked --lib --target x86_64-pc-windows-msvc
          cargo test --locked
      - name: Compile and exercise portable Files validation and framing
        working-directory: packages/oblivion-transfer
        run: |
          cargo check --locked --lib --target x86_64-pc-windows-msvc
          cargo test --locked --lib
      - name: Compile and exercise shared frontend commands, run and proxy grammar
        working-directory: packages/oblivion-cli
        run: |
          cargo check --locked --lib --target x86_64-pc-windows-msvc
          cargo test --locked

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Scan the public source tree
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          detect --source=/repo --no-git --redact --config=/repo/.gitleaks.toml --exit-code=1

  windows-backend:
    name: HCS helper and private Windows I/O (no VM acceptance)
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/oblivion-native-windows
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust compiler
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Exercise native ACLs, private pipe peers, cancellation and lifetime
        run: cargo test --locked --all-targets
      - name: Link the actual HCS helper
        run: cargo build --locked --bin oblivion-vm
      - name: Record acceptance scope
        run: |
          'These tests exercise Windows kernel objects and portable HCS models. They do not create a VM or qualify Hyper-V permissions, bootstrap, nested KVM, networking, the frontend or installation.' >> $env:GITHUB_STEP_SUMMARY

  windows-manager:
    name: Windows x64 frontend (no VM backend)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Check the shared frontend with the official TypeScript compiler
        run: bun run --cwd packages/oblivion-manager typecheck:tsc
      - name: Exercise target discovery and real picker components
        working-directory: packages/oblivion-manager
        run: bun test --timeout 30000 test/manager-target.test.ts test/file-picker.test.tsx
      - name: Compile the actual manager and pinned OpenTUI DLL
        run: |
          bun run --cwd packages/oblivion-manager build --target=bun-windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = 'artifacts/oblivion-manager/bun-windows-x64/oblivion-manager.exe'
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $binary))
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Expected the current Windows PE frontend' }
          if (-not (Test-Path 'artifacts/oblivion-manager/bun-windows-x64/assets/@opentui/core-win32-x64/opentui.dll' -PathType Leaf)) { throw 'Pinned OpenTUI DLL missing' }

  javascript:
    name: Manager and native tools (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Canonical check
        run: bun run check
      - name: Official TypeScript compiler
        run: bun run typecheck:tsc
      - name: Run each retained workspace suite
        run: |
          for package in oblivion-manager oblivion-tools theme tui-kit; do
            (cd "packages/$package" && bun test --timeout 30000)
          done
      - name: Build production manager and MCP bundles
        run: |
          bun run --cwd packages/oblivion-tools build
          bun run --cwd packages/oblivion-manager build --target=bun-linux-${{ matrix.arch }}
      - name: Preserve current-source bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oblivion-native-ui-${{ matrix.arch }}-${{ github.sha }}
          path: |
            artifacts/oblivion-manager/bun-linux-${{ matrix.arch }}/
            packages/oblivion-tools/dist/server.mjs
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Native Linux code and local protocols (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the pinned compiler and native build tools
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make g++ perl libclang-dev python3 zstd util-linux e2fsprogs initramfs-tools-core cpio
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/oblivion-*/target
          key: rust-linux-${{ matrix.arch }}-1.88.0-${{ hashFiles('packages/oblivion-*/Cargo.lock') }}
      - name: Compile current controller and launcher
        working-directory: packages/oblivion-host
        run: |
          cargo check --locked --lib --bins
          cargo check --locked --lib --bins --features lab-emulation
          cargo test --locked --lib --bin oblivion --bin oblivion-storage
          cargo test --locked --test frontend --test frontend_safes --test frontend_files --test frontend_settings --test frontend_family --test frontend_tasks --test frontend_backup --test safe_admin --test delegation --test backup_cli --test file_attachment --test managed --test terminal_screen --test workspace --test share_control --test channel
      - name: Exercise the portable private wire
        working-directory: packages/oblivion-wire
        run: cargo test --locked
      - name: Verify native bundle pairing and distribution inventory
        run: PYTHONDONTWRITEBYTECODE=1 python3 script/oblivion/native-bundle/test-bundle.py
      - name: Verify outer hypervisor kernel and QEMU evidence
        run: |
          python3 -B script/oblivion/test-hypervisor-kernel.py
          python3 -B script/oblivion/test-hypervisor-qemu.py
      - name: Exercise real local PTY and scoped control protocols
        working-directory: packages/oblivion-host
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/file-channel.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/activity-client.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/native-overlay.py
          # The real relay accepts the Safe UID 1000 or root; hosted runners
          # may use another UID, which would skip its peer-credential fixture.
          sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 tests/safe-tools-relay.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/managed-job.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/agent-channel.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/credential-delegation.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/native-runtime.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/runtime-network.py
      - name: Check native agent configuration preservation
        working-directory: packages/oblivion-host/guest/native-tools
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_configure
      - name: Prepare the isolated native workspace fixture
        run: |
          docker build --tag oblivion-native-guest-fixture - <<'DOCKERFILE'
          FROM debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          RUN apt-get update && apt-get install -y --no-install-recommends python3 tmux bash util-linux cryptsetup zstd \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
      - name: Exercise actual tmux panes and native agent wrappers offline
        working-directory: packages/oblivion-host
        run: sh tests/workspace-guest.sh oblivion-native-guest-fixture
      - name: Verify Safe publication, child authority, idle fences and backup revocation in isolated root state
        working-directory: packages/oblivion-host
        run: |
          cargo build --locked --bin oblivion-storage
          test_binary=$(cargo test --locked --bin oblivion-storage --no-run --message-format=json | python3 -c '
          import json, sys
          artifacts = [json.loads(line) for line in sys.stdin]
          binaries = [item["executable"] for item in artifacts if item.get("reason") == "compiler-artifact" and item.get("target", {}).get("name") == "oblivion-storage" and item.get("profile", {}).get("test") and item.get("executable")]
          assert len(binaries) == 1, "expected one current storage test executable"
          print(binaries[0])')
          test -x "$test_binary"
          storage_worker="$(dirname "$test_binary")/../oblivion-storage"
          test -x "$storage_worker"
          for fixture in \
            share_import::tests::atomic_collection_publish_and_abort_keep_existing_safes_untouched \
            share_import::tests::retained_request_nonce_expires_at_the_real_host_opening_authorization_boundary \
            storage::agent_safe_tests::closed_ram_child_is_counted_once_and_parent_close_fences_private_lookup \
            ipc::family_tests::child_task_requests_cannot_supply_execution_facts_or_unscoped_authority \
            ipc::family_tests::backup_rpc_rejects_unscoped_sources_paths_and_attachment_secrets \
            ipc::family_tests::backup_metadata_failure_does_not_claim_a_live_volume_owner \
            backup_host::tests::lock_revokes_a_real_hashing_process_without_inheriting_controller_locks \
            idle_controller::tests::private_preferences_and_generation_fences; do
            docker run --rm --network none --tmpfs /run:rw,nosuid,nodev,noexec,size=16m \
              --mount "type=bind,src=$test_binary,dst=/storage-tests,readonly" \
              --mount "type=bind,src=$storage_worker,dst=/storage-worker,readonly" \
              --env OBLIVION_SHARE_IMPORT_TEST=1 --env OBLIVION_SHARE_IMPORT_AUTH_TEST=1 --env OBLIVION_RAM_CHILD_TEST=1 --env OBLIVION_CHILD_TASK_RPC_TEST=1 \
              --env OBLIVION_BACKUP_RPC_TEST=1 --env OBLIVION_BACKUP_PROCESS_TEST=1 --env OBLIVION_BACKUP_WORKER_BINARY=/storage-worker \
              --env OBLIVION_IDLE_CONTROLLER_TEST=1 \
              oblivion-native-guest-fixture /bin/sh -ec '
                fixture_listing=$(/storage-tests --list --exact "$1")
                case "$fixture_listing" in
                  "$1: test"*) ;;
                  *) printf "Required storage fixture is missing: %s\n" "$1" >&2; exit 1 ;;
                esac
                exec /storage-tests --ignored --exact "$1"
              ' sh "$fixture"
          done
      - name: Verify interrupted family password changes with real LUKS2 headers
        working-directory: packages/oblivion-host
        run: |
          # Argon2 runs at the production cost; use the optimized fixture rather
          # than slowing it down with a debug build or weakening its parameters.
          test_binary=$(cargo test --release --locked --bin oblivion-storage family_rotation_host::tests --no-run --message-format=json | python3 -c '
          import json, sys
          artifacts = [json.loads(line) for line in sys.stdin]
          binaries = [item["executable"] for item in artifacts if item.get("reason") == "compiler-artifact" and item.get("target", {}).get("name") == "oblivion-storage" and item.get("profile", {}).get("test") and item.get("executable")]
          assert len(binaries) == 1, "expected one current release storage test executable"
          print(binaries[0])')
          test -x "$test_binary"
          for fixture in family_rotation_host::tests::interrupted_rewrap_fences_family_and_recovers_original_keys_and_standalone_child family_rotation_host::tests::unknown_member_header_prevents_every_write_and_explicit_rollback_restores_all; do
            docker run --rm --network none --tmpfs /run:rw,nosuid,nodev,noexec,size=256m \
              --mount "type=bind,src=$test_binary,dst=/storage-tests,readonly" \
              --env OBLIVION_FAMILY_ROTATION_TEST=1 \
              oblivion-native-guest-fixture /bin/sh -ec '
                fixture_listing=$(/storage-tests --list --exact "$1")
                case "$fixture_listing" in
                  "$1: test"*) ;;
                  *) printf "Required password fixture is missing: %s\n" "$1" >&2; exit 1 ;;
                esac
                exec /storage-tests --ignored --exact "$1"
              ' sh "$fixture"
          done
      - name: Verify development Debian package install and data-preserving removal
        run: sh script/oblivion/test-deb.sh
      - name: Check native per-agent Share without source credentials
        working-directory: packages/oblivion-history
        run: |
          for suite in test_portable.py test_prepare.py test_share_plan.py test_share_channel.py; do
            test -f "tests/$suite"
          done
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile and test the Linux desktop helper
        working-directory: packages/oblivion-native-linux
        run: |
          cargo check --locked --all-targets
          cargo test --locked
      - name: Compile and test the gateway and bounded transfer libraries
        run: |
          for package in oblivion-gateway oblivion-transfer oblivion-transport oblivion-tor-state; do
            (cd "packages/$package" && cargo check --locked --lib --bins && cargo test --locked --lib)
          done
          (cd packages/oblivion-transfer && cargo test --locked --offline --test approved --test share --test personal_copy --test native_files --test prepared_files --test multi_files --test transfer_inventory --test endpoint --test relay --test stream && cargo build --locked --offline --bin oblivion-copy)
      - name: Recover receiver records after a real filesystem remount
        working-directory: packages/oblivion-transfer
        run: |
          test_binary=$(cargo test --locked --test remount --no-run --message-format=json | python3 -c '
          import json, sys
          artifacts = [json.loads(line) for line in sys.stdin]
          binaries = [item["executable"] for item in artifacts if item.get("reason") == "compiler-artifact" and item.get("target", {}).get("name") == "remount" and item.get("profile", {}).get("test") and item.get("executable")]
          assert len(binaries) == 1, "expected one current remount test executable"
          print(binaries[0])
          ')
          test -x "$test_binary"
          remount_fixture=verified_transfer_recovers_after_the_same_filesystem_gets_a_different_device_number
          fixture_listing=$("$test_binary" --list --ignored --exact "$remount_fixture")
          case "$fixture_listing" in
            "$remount_fixture: test"*) ;;
            *) printf 'Required remount fixture is missing: %s\n' "$remount_fixture" >&2; exit 1 ;;
          esac
          sudo -n unshare --mount --propagation private "$test_binary" --ignored --exact "$remount_fixture" --nocapture
      - name: Verify Share guest streams with the real copy endpoint
        working-directory: packages/oblivion-history
        env:
          OBLIVION_COPY_TEST_BINARY: ${{ github.workspace }}/packages/oblivion-transfer/target/debug/oblivion-copy
        run: |
          test -x "$OBLIVION_COPY_TEST_BINARY"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 OBLIVION_COPY_TEST_BINARY="$OBLIVION_COPY_TEST_BINARY" \
            python3 -m unittest discover -s tests -p 'test_share_*.py' -v
      - name: Verify the portable Share container in release mode
        working-directory: packages/oblivion-share
        run: cargo test --locked --release --test container
      - name: Record acceptance scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SCOPE'
          These jobs compile current native sources and exercise local protocol fixtures.
          They do not qualify nested virtualization, encrypted Safe lifecycle, real Tor
          routing, provider login or physical media. Those remain a separate manual
          acceptance gate on supported Mac/Linux hardware; no TCG fallback or synthetic
          guest substitutes for that gate.
          SCOPE

  macos:
    name: Native macOS launcher and Virtualization.framework helper
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust compiler
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Install the native rollout decompressor
        run: brew install zstd
      - name: Compile and test the desktop launcher
        working-directory: packages/oblivion-host
        run: |
          cargo check --locked --lib --bin oblivion
          cargo test --locked --lib --bin oblivion
          cargo test --locked --test frontend --test frontend_safes --test frontend_files --test frontend_settings --test frontend_family --test frontend_tasks --test frontend_backup --test managed --test delegation --test backup_cli --test file_attachment --test terminal_screen --test workspace --test share_control --test channel
          PYTHONDONTWRITEBYTECODE=1 python3 tests/file-channel.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/activity-client.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/native-overlay.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/managed-job.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/agent-channel.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/credential-delegation.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/native-runtime.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/runtime-network.py
      - name: Compile the actual Apple helper
        working-directory: packages/oblivion-native
        run: swift build --configuration release
      - name: Exercise the portable private wire
        working-directory: packages/oblivion-wire
        run: cargo test --locked
      - name: Verify native bundle pairing and distribution inventory
        run: PYTHONDONTWRITEBYTECODE=1 python3 script/oblivion/native-bundle/test-bundle.py
      - name: Verify native file reconciliation and ciphertext-only personal copies
        working-directory: packages/oblivion-transfer
        run: cargo test --locked --test personal_copy --test native_files --test prepared_files --test multi_files --test transfer_inventory --test endpoint --test relay --test stream
      - name: Check native per-agent Share without source credentials
        working-directory: packages/oblivion-history
        run: |
          for suite in test_portable.py test_prepare.py test_share_plan.py test_share_channel.py; do
            test -f "tests/$suite"
          done
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify the portable Share container in release mode
        working-directory: packages/oblivion-share
        run: cargo test --locked --release --test container
      - name: Record acceptance scope
        run: |
          echo 'Compilation does not qualify Apple nested virtualization. A real supported Apple Silicon Mac with the required macOS release must pass the manual VM acceptance gate.' >> "$GITHUB_STEP_SUMMARY"
