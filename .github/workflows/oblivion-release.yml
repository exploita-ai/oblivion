name: Oblivion image drafts

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: oblivion-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize image source
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      image_name: ${{ steps.source.outputs.image_name }}
      channel: ${{ steps.bundle.outputs.channel }}
      product_version: ${{ steps.bundle.outputs.product_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bundle-metadata
        id: bundle
      - name: Prepare an immutable draft destination for tagged builds
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.bundle.outputs.channel }}
          PRODUCT_VERSION: ${{ steps.bundle.outputs.product_version }}
          REVISION: ${{ steps.bundle.outputs.revision }}
        run: |
          set -euo pipefail
          printf 'image_name=oblivion-%s\n' "$PRODUCT_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = dev ]; then
            exit 0
          fi
          prerelease=false
          if [ "$CHANNEL" = rc ]; then prerelease=true; fi
          if existing=$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease); then
            test "$(printf '%s' "$existing" | jq -r '.isDraft')" = true
            test "$(printf '%s' "$existing" | jq -r '.isPrerelease')" = "$prerelease"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --target "$REVISION" \
              --title "Oblivion $GITHUB_REF_NAME" --draft --prerelease="$prerelease" --generate-notes
          fi

  build:
    name: Build ${{ matrix.arch }} image
    needs: authorize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the public image
        env:
          OBLIVION_ARCH: ${{ matrix.arch }}
          OBLIVION_BUNDLE_CHANNEL: ${{ needs.authorize.outputs.channel }}
          OBLIVION_DESKTOP_VERSION: ${{ needs.authorize.outputs.product_version }}
          OBLIVION_BUILD_SCOPE: GitHub image built from the recorded public source commit and explicit channel; checksums are not a cryptographic signature.
          OBLIVION_IMAGE_NAME: ${{ needs.authorize.outputs.image_name }}
        run: bun run build:live
      - name: Verify and stage the image
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.arch }}
          IMAGE_NAME: ${{ needs.authorize.outputs.image_name }}
        run: |
          set -euo pipefail
          directory=artifacts/oblivion-stack-$ARCHITECTURE
          (cd "$directory" && sha256sum --check SHA256SUMS)
          iso="$directory/$IMAGE_NAME-$ARCHITECTURE.iso"
          test -f "$iso"
          test "$(find "$directory" -maxdepth 1 -type f -name '*.iso' | wc -l)" -eq 1
          test "$(stat -c %s "$iso")" -gt 0
          python3 -B script/oblivion/release-assets.py --input "$iso" --output release
      - name: Retain built images and architecture checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oblivion-image-${{ matrix.arch }}-${{ github.sha }}
          path: release/
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - uses: ./.github/actions/upload-bundle-release
        with:
          channel: ${{ needs.authorize.outputs.channel }}
          directory: release
      - name: Record release qualification scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SCOPE'
          These are current-source image builds with checksums, not qualified releases.
          RC and stable tags remain drafts; source checks and branch ancestry are required.
          Automatic publication is disabled until real native nested-VM acceptance and
          distribution requirements are satisfied and recorded for this commit and artifact.
          Compilation, local protocol tests and image hashes do not replace that gate.
          SCOPE
