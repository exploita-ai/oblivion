name: Oblivion images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: oblivion-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize image source
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      image_name: ${{ steps.source.outputs.image_name }}
      release: ${{ steps.source.outputs.release }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main or a tag contained in main
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            printf 'image_name=oblivion-main-%s\n' "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
            printf 'release=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$GITHUB_REF" in refs/tags/v*) ;; *) exit 1;; esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          tag=${GITHUB_REF_NAME}
          printf 'image_name=oblivion-%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'release=true\n' >> "$GITHUB_OUTPUT"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Oblivion $tag" \
              --draft --prerelease --generate-notes
          fi

  build:
    name: Build ${{ matrix.arch }} image
    needs: authorize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the public image
        env:
          OBLIVION_ARCH: ${{ matrix.arch }}
          OBLIVION_BUILD_SCOPE: GitHub release-candidate image built from the recorded public source commit; checksums are not a cryptographic signature.
          OBLIVION_IMAGE_NAME: ${{ needs.authorize.outputs.image_name }}
        run: bun run build:iso
      - name: Verify and stage the image
        id: image
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.arch }}
          IMAGE_NAME: ${{ needs.authorize.outputs.image_name }}
        run: |
          set -euo pipefail
          directory=artifacts/oblivion-beta-iso/image
          if [ "$ARCHITECTURE" = arm64 ]; then directory=artifacts/oblivion-arm-iso/image; fi
          (cd "$directory" && sha256sum --check SHA256SUMS)
          iso="$directory/$IMAGE_NAME-$ARCHITECTURE.iso"
          test -f "$iso"
          test "$(find "$directory" -maxdepth 1 -type f -name '*.iso' | wc -l)" -eq 1
          test "$(stat -c %s "$iso")" -lt 2147483648
          mkdir release
          cp "$iso" release/
          (cd release && sha256sum "$(basename "$iso")" > "$IMAGE_NAME-$ARCHITECTURE.sha256")
          printf 'iso=%s\n' "release/$(basename "$iso")" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "release/$IMAGE_NAME-$ARCHITECTURE.sha256" >> "$GITHUB_OUTPUT"
      - name: Upload directly to the draft GitHub Release
        if: needs.authorize.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISO: ${{ steps.image.outputs.iso }}
          CHECKSUM: ${{ steps.image.outputs.checksum }}
        run: gh release upload "$GITHUB_REF_NAME" "$ISO" "$CHECKSUM" --clobber

  publish:
    name: Publish verified release
    if: needs.authorize.outputs.release == 'true'
    needs: [authorize, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require a successful main-branch verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list --repo "$REPOSITORY" --workflow oblivion-check.yml \
            --commit "$GITHUB_SHA" --event push --status completed \
            --json conclusion --jq '.[0].conclusion // ""')
          test "$conclusion" = success
      - name: Combine architecture checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir checksums
          gh release download "$GITHUB_REF_NAME" --repo "$REPOSITORY" \
            --pattern 'oblivion-*.sha256' --dir checksums
          test "$(find checksums -type f -name '*.sha256' | wc -l)" -eq 2
          cat checksums/*.sha256 | sort -k2 > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$REPOSITORY" --clobber
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$REPOSITORY" --draft=false --prerelease
