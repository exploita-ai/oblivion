name: Oblivion native desktop artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oblivion-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    name: Build private controller (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and stage the paired controller inputs
        shell: bash
        env:
          OBLIVION_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$OBLIVION_ARCH/$(uname -m)" in
            amd64/x86_64|arm64/aarch64) ;;
            *) echo 'A native Linux runner matching the controller architecture is required.' >&2; exit 1 ;;
          esac
          export OBLIVION_IMAGE_NAME="oblivion-controller-${GITHUB_SHA:0:12}"
          sh script/oblivion/build-runtime.sh
          runtime="artifacts/oblivion-runtime-$OBLIVION_ARCH"
          (
            cd "$runtime"
            sha256sum --check --strict SHA256SUMS
            test -s "$OBLIVION_IMAGE_NAME-$OBLIVION_ARCH.iso"
            test "$(find . -maxdepth 1 -type f -name '*.iso' | wc -l)" -eq 1
          )
          transfer="artifacts/oblivion-controller-transfer-$OBLIVION_ARCH"
          mkdir "$transfer"
          mv "$runtime" "$transfer/controller"
          # The controller source inventory covers these generated bytes too.
          cp packages/oblivion-tools/dist/server.mjs "$transfer/server.mjs"
      - name: Retain the controller and source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oblivion-controller-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/oblivion-controller-transfer-${{ matrix.arch }}/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  macos:
    name: Build Apple Silicon development bundle
    needs: controller
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oblivion-controller-arm64-${{ github.sha }}
          path: artifacts/oblivion-controller-transfer-arm64
      - name: Prepare the native build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          cargo fetch --locked --target aarch64-apple-darwin --manifest-path packages/oblivion-host/Cargo.toml
          mkdir -p packages/oblivion-tools/dist
          cp artifacts/oblivion-controller-transfer-arm64/server.mjs packages/oblivion-tools/dist/server.mjs
      - name: Build, archive and verify the paired bundle
        shell: bash
        run: |
          set -euo pipefail
          version="1.0.0~dev${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}"
          name="oblivion-$version-darwin-arm64"
          bundle="$PWD/artifacts/oblivion-desktop-darwin-arm64/$name"
          OBLIVION_DESKTOP_VERSION="$version" \
            OBLIVION_DESKTOP_RUNTIME="$PWD/artifacts/oblivion-controller-transfer-arm64/controller" \
            OBLIVION_DESKTOP_OUTPUT="$bundle" sh script/oblivion/build-native.sh
          test "$("$bundle/bin/oblivion" --version)" = "oblivion $version"
          codesign --verify --strict "$bundle/bin/oblivion-vm"
          delivery="$PWD/artifacts/oblivion-desktop-upload"
          mkdir "$delivery"
          COPYFILE_DISABLE=1 tar -C "$(dirname "$bundle")" -cf "$delivery/$name.tar" "$name"
          python3 -B - "$delivery/$name.tar" "$name" <<'PY'
          import json
          import sys
          import tarfile

          path, root = sys.argv[1:]
          with tarfile.open(path, "r:") as archive:
              manifest = json.load(archive.extractfile(root + "/bundle.json"))
              for entry in manifest["files"]:
                  member = archive.getmember(root + "/" + entry["path"])
                  if not member.isfile() or member.size != entry["bytes"] or bool(member.mode & 0o111) != entry["executable"]:
                      raise SystemExit("Archive metadata changed: " + entry["path"])
          PY
          (
            cd "$delivery"
            shasum -a 256 "$name.tar" > "$name.tar.sha256"
            shasum -a 256 --check "$name.tar.sha256"
          )
      - name: Retain the Apple Silicon archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oblivion-desktop-darwin-arm64-${{ github.sha }}
          path: artifacts/oblivion-desktop-upload/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Record acceptance scope
        run: |
          echo 'These are paired development artifacts. Apple signing is ad hoc. Installed use, nested VM acceptance and redistribution remain separate gates.' >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Build Windows x64 development bundle
    needs: controller
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oblivion-controller-amd64-${{ github.sha }}
          path: artifacts/oblivion-controller-transfer-amd64
      - name: Fetch the pinned compiler and build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          foreach ($package in @('oblivion-cli', 'oblivion-native-windows')) {
            cargo fetch --locked --target x86_64-pc-windows-msvc --manifest-path "packages/$package/Cargo.toml"
          }
      - name: Build and archive the paired bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio with x64 MSVC tools is required.' }
          & (Join-Path $visualStudio 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $version = "1.0.0~dev$env:GITHUB_RUN_NUMBER.$($env:GITHUB_SHA.Substring(0, 12))"
          $name = "oblivion-$version-windows-x86_64"
          $env:OBLIVION_DESKTOP_VERSION = $version
          $env:OBLIVION_DESKTOP_OUTPUT = Join-Path $env:GITHUB_WORKSPACE "artifacts/oblivion-desktop-windows-x86_64/$name"
          $env:OBLIVION_DESKTOP_INPUTS = Join-Path $env:GITHUB_WORKSPACE 'artifacts/oblivion-controller-transfer-amd64'
          $build = @'
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'script/oblivion/build-native-windows.ps1') `
            -Runtime (Join-Path $env:OBLIVION_DESKTOP_INPUTS 'controller') `
            -ToolsBundle (Join-Path $env:OBLIVION_DESKTOP_INPUTS 'server.mjs')
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($build))
          cargo run --locked --offline --manifest-path packages/oblivion-native-windows/Cargo.toml --example build-as-user -- (Join-Path $PSHOME 'pwsh.exe') $encoded

          $bundle = $env:OBLIVION_DESKTOP_OUTPUT
          $reported = & (Join-Path $bundle 'bin/oblivion.exe') --version
          if ($reported -cne "oblivion $version") { throw 'Launcher and bundle versions differ.' }
          $delivery = Join-Path $env:GITHUB_WORKSPACE 'artifacts/oblivion-desktop-upload'
          New-Item -Path $delivery -ItemType Directory | Out-Null
          $archive = Join-Path $delivery "$name.zip"
          $pack = @'
          import json
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          root, output = map(Path, sys.argv[1:])
          manifest_path = root / "bundle.json"
          manifest = json.loads(manifest_path.read_bytes())
          with ZipFile(output, "x") as archive:
              archive.write(manifest_path, "bundle.json")
              for entry in manifest["files"]:
                  source = root / entry["path"]
                  if source.stat().st_size != entry["bytes"]:
                      raise ValueError("Bundle file changed: " + entry["path"])
                  archive.write(source, entry["path"])
          '@
          $pack | python -B - $bundle $archive
          $sha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$archive.sha256", "$sha256  $name.zip`n")
      - name: Retain the Windows archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oblivion-desktop-windows-x86_64-${{ github.sha }}
          path: artifacts/oblivion-desktop-upload/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Record acceptance scope
        shell: pwsh
        run: |
          'These are paired unsigned development artifacts. Installed setup, nested Hyper-V acceptance and redistribution remain separate gates.' >> $env:GITHUB_STEP_SUMMARY
