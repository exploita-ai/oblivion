name: Oblivion desktop Debian artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oblivion-desktop-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-deb:
    name: Build desktop package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the paired development package
        shell: bash
        env:
          OBLIVION_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="1.0.0~dev${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}"
          printf 'DESKTOP_DEB_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          OBLIVION_DEB_VERSION="$version" sh script/oblivion/build-desktop-deb.sh
      - name: Verify the package and checksum
        id: package
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          directory="artifacts/oblivion-desktop-deb-$ARCHITECTURE"
          package="oblivion-desktop_${DESKTOP_DEB_VERSION}_${ARCHITECTURE}.deb"
          (cd "$directory" && sha256sum --check --strict "$package.sha256")
          test "$(dpkg-deb -f "$directory/$package" Package)" = oblivion-desktop
          test "$(dpkg-deb -f "$directory/$package" Architecture)" = "$ARCHITECTURE"
          test "$(dpkg-deb -f "$directory/$package" Version)" = "$DESKTOP_DEB_VERSION"
          printf 'deb=%s\n' "$directory/$package" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$directory/$package.sha256" >> "$GITHUB_OUTPUT"
      - name: Retain development package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oblivion-desktop-deb-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.deb }}
            ${{ steps.package.outputs.checksum }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Record acceptance scope
        run: |
          echo 'These are development desktop packages for the recorded source, not release uploads. Checksums do not qualify package installation, Polkit/KVM access, nested guest boot or redistribution.' >> "$GITHUB_STEP_SUMMARY"
