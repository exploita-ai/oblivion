name: Oblivion desktop Debian artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: oblivion-desktop-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Resolve and authorize bundle metadata
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.bundle.outputs.channel }}
      product_version: ${{ steps.bundle.outputs.product_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/bundle-metadata
        id: bundle

  desktop-deb:
    name: Build desktop package (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the paired desktop package
        shell: bash
        env:
          OBLIVION_ARCH: ${{ matrix.arch }}
          OBLIVION_BUNDLE_CHANNEL: ${{ needs.metadata.outputs.channel }}
          OBLIVION_DEB_VERSION: ${{ needs.metadata.outputs.product_version }}
        run: |
          set -euo pipefail
          version="$OBLIVION_DEB_VERSION"
          printf 'DESKTOP_DEB_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          OBLIVION_DEB_VERSION="$version" sh script/oblivion/build-desktop-deb.sh
      - name: Verify the package and checksum
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          directory="artifacts/oblivion-desktop-deb-$ARCHITECTURE"
          package="oblivion-desktop_${DESKTOP_DEB_VERSION}_${ARCHITECTURE}.deb"
          (cd "$directory" && sha256sum --check --strict "$package.sha256")
          test "$(dpkg-deb -f "$directory/$package" Package)" = oblivion-desktop
          test "$(dpkg-deb -f "$directory/$package" Architecture)" = "$ARCHITECTURE"
          test "$(dpkg-deb -f "$directory/$package" Version)" = "$DESKTOP_DEB_VERSION"
          python3 -B script/oblivion/release-assets.py --input "$directory/$package" --output release
      - name: Retain desktop package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oblivion-desktop-deb-${{ matrix.arch }}-${{ github.sha }}
          path: release/
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      - uses: ./.github/actions/upload-bundle-release
        with:
          channel: ${{ needs.metadata.outputs.channel }}
          directory: release
      - name: Record acceptance scope
        run: |
          echo 'These are desktop packages for the recorded source and channel. They are not automatically published releases. Checksums do not qualify package installation, Polkit/KVM access, nested guest boot or redistribution.' >> "$GITHUB_STEP_SUMMARY"
