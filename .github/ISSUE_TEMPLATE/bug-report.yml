name: Bug report
description: Report a reproducible Oblivion defect
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include real credentials here. Use a private GitHub Security Advisory for security-sensitive findings.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact steps, starting from boot when relevant.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or image SHA-256
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [amd64, arm64]
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Physical USB, Mac VM lab, Other VM, Source development]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Non-sensitive diagnostics
      description: Remove passwords, API keys, prompts, documents, network names, and session data before attaching output.
